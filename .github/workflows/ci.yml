name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (compile + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile scripts/serve.py
        run: python -m py_compile scripts/serve.py
      - name: Run pytest
        run: python -m pytest -q
      - name: Score snapshot consistency
        run: python tools/check_consistency.py --base results/score

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend
        working-directory: app
        run: npm ci && npm run build
      - name: Install Playwright chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: UI smoke
        run: |
          python scripts/serve.py --port 8000 --no-browser > serve.log 2>&1 &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::serve.py did not become healthy on :8000"
            echo "----- serve.log -----"
            cat serve.log
            exit 1
          fi
          cd app
          npm run smoke
